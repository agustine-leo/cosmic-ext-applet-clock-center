[package]
name = "cosmic-ext-applet-clock-center"
version = "0.2.5"
edition = "2021"
license = "GPL-3.0-only"
description = "One date/time button for the COSMIC panel: notifications, calendar and media in one popup"

[dependencies]
cosmic-notifications-util = { git = "https://github.com/pop-os/cosmic-notifications" }
cosmic-notifications-config = { git = "https://github.com/pop-os/cosmic-notifications" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "desktop-systemd-scope",
    "winit",
] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1.49.0", features = ["full"] }
jiff = "0.2"
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
